apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-deployment
  namespace: springboot-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-boot-app
  template:
    metadata:
      name: hello-pod
      labels:
        app: spring-boot-app
    spec:
      containers:
        - name: app
          image: sateesh1390/spring-boot-docker:2.0
          ports:
            - containerPort: 8080
          imagePullPolicy: Always